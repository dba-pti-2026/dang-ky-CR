<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype – Đăng ký cộng tác viên (lẻ / nhóm)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--or:#F5862E;--or-l:#fbb57a;--tx:#1f1f1f;--mut:#595959;--bd:#d9d9d9;--blk:#f7f7f8;--red:#ff4d4f;--new:#7c3aed}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);font-size:13px;background:#fff}
a{color:var(--or);cursor:pointer;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ===== Thanh điều khiển prototype (không thuộc UI sản phẩm) ===== */
#proto{position:sticky;top:0;z-index:200;background:#1e1b2e;color:#d9d6ea;display:flex;align-items:center;gap:10px;padding:7px 16px;flex-wrap:wrap;font-size:12px}
#proto .t{font-weight:700;color:#fff;margin-right:4px}
#proto .lb{opacity:.7}
#proto .chips{display:flex;gap:4px;flex-wrap:wrap}
#proto .chip{position:relative;border:1px solid #4a4566;background:transparent;color:#d9d6ea;border-radius:12px;padding:2px 9px;font-size:12px}
#proto .chip.on{background:var(--or);border-color:var(--or);color:#fff}
#proto .chip.chg::after{content:'';position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:#a78bfa}
#proto .seg{display:flex;border:1px solid #4a4566;border-radius:12px;overflow:hidden}
#proto .seg button{background:transparent;border:0;color:#d9d6ea;padding:3px 10px;font-size:12px}
#proto .seg button.on{background:#a78bfa;color:#1e1b2e;font-weight:700}
#proto .sp{flex:1}
#proto label{display:flex;align-items:center;gap:5px;cursor:pointer}
#proto .lg{display:flex;align-items:center;gap:4px;opacity:.8}
#proto .lg i{width:7px;height:7px;border-radius:50%;background:#a78bfa;display:inline-block}


/* ===== Header ===== */
.hdr{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;z-index:1}
.logo{display:flex;align-items:stretch;height:46px;box-shadow:0 0 0 1px #e6e6e6}
.logo .l1{background:#7b7b7b;color:#fff;font-family:Georgia,serif;font-size:21px;display:flex;align-items:center;padding:0 4px 0 9px}
.logo .l2{background:#7b7b7b;display:flex;align-items:center;padding-right:2px}
.logo .l3{background:var(--or);color:#fff;font-weight:700;font-size:21px;display:flex;align-items:center;padding:0 10px 0 4px;letter-spacing:-.3px}
.hdr-r{display:flex;align-items:center;gap:10px;font-size:13px}
.bell{position:relative;color:#8c8c8c;display:flex;margin-right:6px}
.bell b{position:absolute;top:-6px;right:-7px;background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.av{width:30px;height:30px;border-radius:50%;background:#f56a00;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

/* ===== Inputs ===== */
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld>label{display:block;margin-bottom:6px;font-size:12.5px;color:#262626}
.fld>label i{color:var(--red);font-style:normal}
.inp{display:flex;align-items:center;border:1px solid var(--bd);border-radius:6px;background:#fff;height:32px;padding:0 10px;transition:border-color .2s}
.inp:focus-within{border-color:var(--or);box-shadow:0 0 0 2px rgba(245,134,46,.12)}
.inp input,.inp select{border:0;outline:0;flex:1;height:100%;font:inherit;font-size:12.5px;background:transparent;color:var(--tx);min-width:0}
.inp input::placeholder{color:#bfbfbf}
.inp.dis{background:#f5f5f5}
.inp.dis input,.inp.dis select{color:#8c8c8c;cursor:not-allowed}
.inp select{appearance:none;cursor:pointer}
.inp select:invalid{color:#bfbfbf}
.inp .sfx{color:#8c8c8c;display:flex;cursor:pointer}
.err-on .inp{border-color:var(--red)}
.err{color:var(--red);font-size:11.5px;margin-top:4px}
.rd-row{display:flex;gap:22px;align-items:center;height:28px}
.rd{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px}
.rd input{display:none}
.rd span{width:15px;height:15px;border:1px solid var(--bd);border-radius:50%;position:relative;background:#fff}
.rd input:checked+span{border-color:var(--or)}
.rd input:checked+span::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--or)}

/* ===== Buttons ===== */
.btn-pri,.btn-def,.btn-dis{height:30px;padding:0 22px;border-radius:5px;font-size:12px;min-width:160px}
.btn-pri{background:var(--or);color:#fff;border:1px solid var(--or)}
.btn-pri:hover{background:#f7944a}
.btn-def{background:#fff;color:#262626;border:1px solid var(--bd)}
.btn-def:hover{border-color:var(--or);color:var(--or)}
.btn-dis{background:#f5f5f5;color:#bfbfbf;border:1px solid var(--bd);cursor:not-allowed}
.btns{display:flex;justify-content:center;gap:16px;margin-top:18px}

/* ===== Bước 1: Đăng ký ===== */
.reg-wrap{display:flex;justify-content:center;padding:110px 0 40px}
.reg-card{width:500px;padding:26px 32px 30px;box-shadow:0 0 6px rgba(0,0,0,.06);border-radius:4px}
.reg-title{color:var(--or);font-size:21px;text-align:center;margin:0 0 4px;font-weight:600}
.reg-sub{text-align:center;margin:0 0 26px;font-size:13px}
.reg-card .fld{margin-bottom:20px}
.reg-card .inp{height:32px}
.full{width:100%;height:32px;font-size:13px}
.terms{text-align:center;margin:12px 0 0;font-size:13px;line-height:1.4}

/* ===== Modal ===== */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:90px 20px 40px}
.mdl{position:relative;background:#fff;border-radius:8px;padding:22px 20px 22px;box-shadow:0 6px 24px rgba(0,0,0,.18);margin:auto 0}
.mdl .x{position:absolute;top:12px;right:14px;background:none;border:0;color:#8c8c8c;padding:2px;display:flex}
.m-title{color:var(--or);text-align:center;font-size:16px;font-weight:500;margin:0 0 14px}
.sec-h{font-weight:700;font-size:14px;margin:0 0 6px}
.sec-d{font-size:11.5px;color:#333;margin:0 0 18px}
.blk{background:var(--blk);border-radius:6px;padding:14px 14px}
.blk+.blk{margin-top:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* OTP */
.otp-m{text-align:center;padding:62px 40px 30px}
.otp-badge{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;background:#fbd7b5;display:flex;align-items:center;justify-content:center}
.otp-m h3{font-size:19px;font-weight:600;margin:0 0 10px}
.otp-m p{font-size:14.5px;margin:0 0 28px;line-height:1.6}
.otp-boxes{display:flex;justify-content:center;gap:2px;margin-bottom:12px}
.otp-boxes input{width:64px;height:60px;border:1px solid #8c8c8c;border-radius:2px;text-align:center;font-size:20px;font-family:inherit;outline:0}
.otp-boxes input:focus{border-color:var(--or);box-shadow:0 0 0 2px rgba(245,134,46,.15)}
.otp-hint{font-size:11px;color:#8c8c8c;margin-bottom:22px}
.rs{color:var(--or-l);font-weight:600;font-size:15px;margin-bottom:22px}
.rs a{color:var(--or);text-decoration:underline}
.otp-m .btn-dis,.otp-m .btn-pri{width:200px;height:42px;font-size:15px}

/* Bước 3 / 13: Hồ sơ */
.tabs{display:flex;gap:22px;padding:0 26px;border-bottom:1px solid #f0f0f0;margin-top:16px}
.tab{padding:10px 0 6px;font-size:11.5px;cursor:pointer;color:#262626;border-bottom:2px solid transparent}
.tab.on{color:var(--or);border-color:var(--or)}
.pf{padding:24px 26px 40px}
.pf-name{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.pf-name .big{width:40px;height:40px;border-radius:50%;background:#bfbfbf;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.pf-name b{font-size:14.5px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.ps{background:var(--blk);border-radius:4px;padding:10px 0 2px;margin-bottom:16px}
.ps-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:11.5px;padding:2px 18px 8px}
.ps-h svg{color:#595959}
.pr{display:grid;grid-template-columns:300px 1fr 20px;padding:8px 18px;border-top:1px solid #ececec;font-size:11px;align-items:center}
.pr:first-of-type{border-top:0}
.pr .v{font-weight:700}
.pr .ic{color:var(--or);display:flex;justify-content:flex-end;cursor:pointer}

/* Bước 4: Chương trình hợp tác */
.biz{padding:12px 22px 40px}
.bb{display:flex;background:linear-gradient(90deg,#fdebd8,#fdf0e2 60%,#fbe6d0);border-radius:2px;overflow:hidden;position:relative}
.bb-t{flex:1;padding:24px 24px 26px;font-size:12px;line-height:1.6;max-width:1200px}
.bb-t p{margin:0}
.bb-t ul{margin:2px 0 14px;padding-left:32px}
.btn-sm{background:var(--or);color:#fff;border:0;border-radius:4px;height:24px;padding:0 12px;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.bb-i{width:400px;display:flex;align-items:center;justify-content:center;padding:6px}
.dl{background:#f1f2fb;border-radius:20px;margin-top:16px;padding:28px 34px 34px}
.dl h2{font-size:24px;font-weight:600;margin:6px 0 24px}
.dc{display:flex;gap:26px;background:#fff;border-radius:8px;padding:24px 30px;margin-bottom:20px;align-items:flex-start}
.dc h3{font-size:19px;margin:6px 0 10px;font-weight:700}
.dc p{margin:0;font-size:16px;color:#3a3a4a;line-height:1.55}

/* Bước 5: Tải CCCD */
.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.up-box{border:1px solid #e6e6e6;height:232px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:8px}
.up-box.empty{border:2px dashed var(--or-l);border-radius:6px;background:#fdfdfd}
.up-empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:#bfbfbf;font-size:12px}
.up-link{display:block;text-align:center;font-size:11.5px;margin:14px 0 26px}
.up-tips{font-size:11px;line-height:1.7}
.spin{width:22px;height:22px;border:2px solid #fde2c8;border-top-color:var(--or);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Bước 9: Xác nhận */
.cf .blk{padding:10px 14px}
.cr{display:grid;grid-template-columns:220px 1fr;font-size:11.5px;padding:4px 0}
.cr .v{font-weight:700}

/* Bước 10: Hợp đồng */
.ct-t{color:var(--or);text-align:center;font-size:14.5px;font-weight:600;margin:20px 0 6px}
.ct-s{text-align:center;font-size:9.5px;margin:0 0 14px}
.ct-read{font-size:11px;margin:0 0 8px 12px}
.doc{height:365px;overflow-y:auto;border:1px solid #ccc;border-radius:8px;margin:0 42px;background:#f3f3f3;padding:40px 40px}
.doc-in{background:#fff;padding:22px 26px 34px;font-size:8.5px;line-height:1.55;color:#222;font-family:'Times New Roman',Times,serif;text-align:justify}
.doc-in p{margin:3px 0}
.doc-in .hd-logo img{width:86px;height:auto}
.doc-in .hd-title{text-align:center;font-size:13px;margin:2px 0 6px}
.doc-in .hd-bar{background:#f39433;color:#fff;font-weight:700;padding:2px 6px;margin:9px 0 4px}
.doc-in .hd-pl{text-align:center;font-size:10px;border-top:1px dashed #ccc;padding-top:16px;margin-top:22px}
.doc-in .hd-c{text-align:center}
.doc-in .hd-ind{margin:3px 0 3px 22px}
.doc-in .hd-ln{display:flex;gap:40px;border-bottom:1px solid #eee;padding-bottom:2px}
.doc-in .hd-ln span:first-child{min-width:46%}
.doc-in ul{margin:3px 0;padding-left:22px}
.doc-in li p{margin:1px 0}
.doc-in .hd-sign{width:100%;margin-top:14px;border-collapse:collapse}
.doc-in .hd-sign th{font-weight:400;text-align:left;vertical-align:top;padding:4px 6px}
.doc-in .hd-sign th p:first-child{text-align:center;margin-bottom:24px}
.ck{display:flex;align-items:center;gap:8px;font-size:9.5px;margin:14px 0 0 0;cursor:pointer}
.ck input{accent-color:var(--or);margin:0}
.ct-btns .btn-pri,.ct-btns .btn-def,.ct-btns .btn-dis{height:24px;font-size:9.5px;min-width:128px;padding:0 10px}
.sub{position:absolute;inset:20px;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;border-radius:2px}
.sub-c{position:relative;background:#fff;border-radius:22px;width:432px;padding:64px 30px 26px;text-align:center}
.sub-c .bdg{position:absolute;top:-48px;left:50%;transform:translateX(-50%)}
.sub-c h4{font-size:12.5px;font-weight:600;margin:0 0 6px}
.sub-c p{font-size:10px;margin:0 0 14px;line-height:1.55}
.sub-c .otp-boxes{gap:7px}
.sub-c .otp-boxes input{width:32px;height:32px;border:1px solid #d0d0d0;border-radius:5px;font-size:14px}
.exp{font-size:9.5px;font-style:italic;margin:24px 0 18px}
.rs2{font-size:9.5px;text-decoration:underline;color:#262626;margin-bottom:18px}
.rs2 a{color:var(--or)}
.sub-c .btns{margin-top:0;gap:6px}
.sub-c .btns button{min-width:96px;height:26px;font-size:10px;padding:0 10px}
.ok-t{width:100%;border-collapse:collapse;font-size:10px;margin:6px 0 16px}
.ok-t td{padding:6px 0;border-bottom:1px solid #eee;text-align:left}
.ok-t td:last-child{text-align:right;font-weight:600}
</style>
</head>

ng công nghệ hỗ trợ cho các hoạt động phát triển, phân phối, bán các sản phẩm, dịch vụ trong các lĩnh vực về bảo hiểm, tài chính, chứng khoán, bất động sản và các sản phẩm, dịch vụ tiêu dùng khác phù hợp với ngành nghề kinh doanh đã đăng ký của IPA LIVING; được quyền phân phối, tiếp thị, bán và quảng bá các Sản phẩm/Dịch vụ theo Hợp đồng Đại lý/Hợp đồng hợp tác/Hợp đồng phân phối ký giữa IPA LIVING với các Doanh nghiệp hoạt động trong lĩnh vực kinh doanh bảo hiểm, chứng khoán, tài chính, bất động sản và các doanh nghiệp sản xuất, kinh doanh, phân phối sản phẩm, dịch vụ tiêu dùng khác, có nhu cầu mở rộng mạng lưới khách hàng;</p> <p>B. Cộng Tác Viên là cá nhân đủ 18 tuổi trở lên, có đầy đủ năng lực hành vi dân sự và các điều kiện cần thiết để thực hiện các công việc giới thiệu khách hàng, giới thiệu và chào bán các Sản phẩm/Dịch vụ mà IPA LIVING kinh doanh, phân phối theo quy định của pháp luật; Cộng Tác Viên mong muốn giao kết Hợp Đồng này với IPA LIVING để trên cơ sở đó Cộng Tác Viên sẽ thực hiện các công việc/hoạt động giới thiệu Khách hàng cho IPA LIVING và/hoặc chào bán các Sản phẩm/Dịch vụ của IPA LIVING theo quy định của Hợp đồng này và phù hợp với quy định của pháp luật. Đối với Sản phẩm/Dịch vụ có điều kiện (theo định nghĩa tại khoản 6 Điều 1), Cộng Tác Viên chỉ thực hiện việc thu thập và cung cấp cho IPA LIVING thông tin liên hệ của tổ chức, cá nhân có nhu cầu hoặc có tiềm năng sử dụng Sản phẩm/Dịch vụ đó theo quy định tại khoản 3, khoản 4 Điều 2 Hợp đồng này; Cộng Tác Viên không thực hiện hoạt động đại lý bảo hiểm, môi giới hoặc bất kỳ hoạt động nào khác mà pháp luật chuyên ngành yêu cầu phải có chứng chỉ hành nghề, điều kiện.</p> <p><em><strong>Hợp đồng này được các bên cùng nhất trí giao kết với các nội dung như sau:</strong></em></p> <div class=\"hd-bar\">ĐIỀU 1. GIẢI THÍCH THUẬT NGỮ</div> <p>Trừ khi ngữ cảnh có yêu cầu khác đi, các từ ngữ và thuật ngữ nêu trong Hợp đồng này sẽ được hiểu như sau:</p> <p>1. Doanh nghiệp Đối tác: Là các doanh nghiệp có giao kết Hợp đồng đại lý/Hợp đồng hợp tác/Hợp đồng phân phối với IPA LIVING để cho phép IPA LIVING làm đại lý, đơn vị phân phối Sản phẩm/Dịch vụ theo các Hợp đồng đại lý/Hợp đồng hợp tác giao kết giữa IPA LIVING với các doanh nghiệp đó. Doanh nghiệp Đối tác bao gồm các doanh nghiệp hoạt động trong lĩnh vực kinh doanh bảo hiểm, chứng khoán, tài chính, bất động sản và các doanh nghiệp sản xuất, kinh doanh, phân phối sản phẩm, dịch vụ tiêu dùng khác.</p> <p>2. Khách hàng: Là (các) tổ chức cá nhân có nhu cầu tham gia/mua Sản Phẩm/Dịch vụ của IPA LIVING và/hoặc Sản phẩm/Dịch vụ của Doanh nghiệp Đối tác trên cơ sở được Cộng Tác Viên giới thiệu, chào bán theo quy định của Hợp đồng này; đối với Sản phẩm/Dịch vụ có điều kiện, là tổ chức, cá nhân có thông tin liên hệ do Cộng Tác Viên cung cấp cho IPA LIVING theo khoản 3 Điều 2.</p> <p>3. (các) Hợp Đồng cung cấp Sản phẩm/Dịch vụ: là các thỏa thuận bằng văn bản giữa Khách hàng với IPA LIVING và/hoặc giữa Khách hàng với Doanh nghiệp Đối tác.</p> <p>4. Sản Phẩm/Dịch vụ: Là các Sản phẩm và/hoặc Dịch vụ mà IPA LIVING giao cho Cộng Tác Viên thực hiện giới thiệu, phân phối, chào bán, tiếp thị, quảng bá trong phạm vi phù hợp với ngành nghề kinh doanh của IPA LIVING. Sản phẩm/Dịch vụ bao gồm các Sản phẩm/Dịch vụ cho chính IPA LIVING cung cấp/chào bán cho Khách hàng và/hoặc Sản phẩm/Dịch vụ mà IPA LIVING là đối tác phát triển/cung cấp theo các Hợp đồng đại lý/Hợp đồng hợp tác ký giữa IPA LIVING với Doanh nghiệp Đối tác. Đối với Sản phẩm/Dịch vụ có điều kiện, phạm vi Công việc cộng tác chỉ được xác định theo khoản 3, khoản 4 Điều 2; các quy định khác của Hợp đồng chỉ áp dụng trong phạm vi không trái với các khoản này.</p> <p>5. Lãnh thổ: Là nước Cộng hòa xã hội chủ nghĩa Việt Nam, phạm vi lãnh thổ trong Hợp đồng có thể thay đổi theo từng thời kỳ theo thông báo của IPA LIVING.</p> <p>6. Sản phẩm/Dịch vụ có điều kiện: Là Sản phẩm/Dịch vụ mà pháp luật chuyên ngành quy định cá nhân thực hiện hoạt động tư vấn, giới thiệu, chào bán, môi giới phải có chứng chỉ hành nghề hoặc đáp ứng điều kiện nhất định, bao gồm nhưng không giới hạn sản phẩm bảo hiểm, chứng khoán, bất động sản, sản phẩm tài chính, tín dụng.</p> <div class=\"hd-bar\">ĐIỀU 2. PHẠM VI CÔNG VIỆC</div> <p>1. Cộng Tác Viên đồng ý hợp tác với IPA LIVING để trở thành người cộng tác thực hiện các công việc giới thiệu Khách hàng, tiếp thị, chào bán Sản phẩm/Dịch vụ với phạm vi như sau (không áp dụng đối với Sản phẩm/Dịch vụ có điều kiện; phạm vi đối với Sản phẩm/Dịch vụ có điều kiện thực hiện theo khoản 3, khoản 4 Điều 2):</p> <ul> <li><p>Giới thiệu cho IPA LIVING các Khách hàng có nhu cầu mua và/hoặc sử dụng các Sản phẩm/Dịch vụ;</p></li> <li><p>Tìm kiếm Khách hàng có nhu cầu mua và/hoặc sử dụng Sản phẩm/Dịch vụ;</p></li> <li><p>Giới thiệu, tư vấn, chào bán các Sản phẩm/Dịch vụ đến Khách hàng;</p></li> <li><p>Thu xếp việc giao kết hợp đồng mua/cung cấp Sản phẩm/Dịch vụ;</p></li> <li><p>Hướng dẫn Khách hàng thanh toán/nộp phí theo yêu cầu của IPA LIVING trong từng thời điểm;</p></li> <li><p>Thực hiện các hoạt động khác có liên quan đến phát triển Khách hàng và/hoặc chào bán các Sản phẩm/Dịch vụ theo yêu cầu của IPA LIVING.</p></li> </ul> <div class=\"hd-ind\"><p>(các công việc nêu trên sau đây gọi tắt là Công việc cộng tác).</p></div> <p>2. Tùy theo từng loại Sản phẩm/Dịch vụ và Chính sách của IPA LIVING và/hoặc Doanh nghiệp Đối tác đối với Sản phẩm/Dịch vụ trong từng thời kỳ, IPA LIVING sẽ quy định và thông báo cụ thể về phạm vi các công việc mà Cộng Tác Viên cần/được thực hiện tương ứng với Sản phẩm/Dịch vụ đó.</p> <p>3. Đối với Sản phẩm/Dịch vụ có điều kiện, Cộng Tác Viên chỉ thực hiện việc thu thập và cung cấp cho IPA LIVING thông tin liên hệ của tổ chức, cá nhân có nhu cầu hoặc có tiềm năng sử dụng Sản phẩm/Dịch vụ đó; không thực hiện hoạt động mà pháp luật chuyên ngành yêu cầu phải có chứng chỉ hành nghề hoặc đáp ứng điều kiện. Riêng đối với sản phẩm bảo hiểm:</p> <p>a) Công việc cộng tác của Cộng Tác Viên chỉ giới hạn ở việc thu thập và cung cấp cho IPA LIVING thông tin liên hệ (họ tên, số điện thoại, email, nhu cầu bảo hiểm sơ bộ) của tổ chức, cá nhân có nhu cầu hoặc có tiềm năng tham gia bảo hiểm và đã đồng ý để IPA LIVING liên hệ (\"Thông tin giới thiệu\").</p> <p>b) Cộng Tác Viên không thực hiện hoạt động đại lý bảo hiểm theo quy định của pháp luật về kinh doanh bảo hiểm.</p> <p>4. Trên cơ sở Thông tin giới thiệu, IPA LIVING trực tiếp thực hiện hoạt động đại lý bảo hiểm thông qua nhân viên đáp ứng điều kiện theo quy định pháp luật, trong phạm vi hợp đồng đại lý bảo hiểm ký với doanh nghiệp bảo hiểm. Cộng Tác Viên không tham gia vào quá trình này.</p> <div class=\"hd-bar\">ĐIỀU 3. THÙ LAO CỦA CỘNG TÁC VIÊN</div> <p>1. Trên cơ sở thực hiện đầy đủ các công việc và nghĩa vụ của mình theo Hợp Đồng này, Cộng Tác Viên sẽ được hưởng khoản thù lao quy định tại Phụ lục đính kèm Hợp đồng này (tùy theo từng Sản phẩm/Dịch vụ).</p> <p>2. Cộng Tác Viên đồng ý và chấp nhận rằng, IPA LIVING có toàn quyền bãi bỏ, thay đổi, bổ sung hoặc điều chỉnh mức thù lao dành cho Cộng Tác Viên trong từng thời kỳ. Trong trường hợp này, mức thù lao mới sẽ được áp dụng theo thông báo của IPA LIVING gửi cho Cộng Tác Viên trong từng thời kỳ.</p> <p>3. IPA LIVING có quyền không thanh toán, quyền khấu trừ hoặc tạm ngưng thanh toán đối với các khoản thù lao của Cộng Tác Viên liên quan đến các vi phạm của Cộng Tác Viên trong việc bán Sản phẩm/Dịch vụ. IPA LIVING cũng có quyền khấu trừ, dùng các khoản thù lao của Cộng Tác Viên để bù trừ/thanh toán bất kỳ các khoản nợ, nghĩa vụ hoặc trách nhiệm nào của Cộng Tác Viên đối với IPA LIVING. Cộng Tác Viên hiểu và đồng ý rằng, việc giữ lại/khấu trừ các khoản thù lao như được quy định tại Điều này sẽ không phải là cơ sở cho bất kỳ khiếu nại, khiếu kiện nào đối với IPA LIVING.</p> <p>4. Cộng Tác Viên sẽ tự chịu trách nhiệm về thuế, phí và chi phí của mình theo quy định của pháp luật phát sinh từ bất kỳ khoản thanh toán nào nhận được do việc thực hiện Hợp Đồng này. Cộng Tác Viên xác nhận và đồng ý rằng, nếu pháp luật có quy định, IPA LIVING có thể được yêu cầu khấu trừ tại nguồn hoặc khấu trừ thuế trước khi thực hiện bất kỳ khoản thanh toán nào cho Cộng Tác Viên, trong trường hợp đó IPA LIVING sẽ không có trách nhiệm dưới bất kỳ hình thức nào phải hoàn lại hoặc bằng cách khác đền bù cho Cộng Tác Viên do thực hiện việc khấu trừ đó.</p> <div class=\"hd-bar\">ĐIỀU 4. QUẢN LÝ, SỬ DỤNG, LƯU TRỮ SỔ SÁCH, HỒ SƠ TÀI LIỆU</div> <p>1. Tất cả các tài liệu hoặc thư từ trao đổi được nộp hoặc gửi đến và được nhận bởi Cộng Tác Viên có liên quan đến Sản phẩm/Dịch vụ cung cấp cho Khách hàng phải được chuyển ngay cho IPA LIVING theo phương thức, cách thức được quy định tại Hợp đồng này hoặc/và các quy định khác do IPA LIVING ban hành tại từng thời điểm.</p> <p>2. Cộng Tác Viên hiểu rằng, mọi giấy tờ, hồ sơ/tài liệu được IPA LIVING hoặc/và Khách hàng cung cấp trong quá trình Cộng Tác Viên thực hiện Công việc cộng tác theo Hợp đồng này đều thuộc quyền quản lý của IPA LIVING. Cộng Tác Viên không được lưu trữ, sử dụng các giấy tờ, hồ sơ tài liệu ngoài mục đích thực hiện công việc theo Hợp đồng này, không được vi phạm quy định của IPA LIVING về quản lý và sử dụng hồ sơ, tài liệu.</p> <p>3. Cộng Tác Viên hoàn toàn chịu trách nhiệm trước pháp luật và trách nhiệm bồi thường cho mọi thiệt hại, tổn thất của IPA LIVING hoặc/và Khách hàng do việc làm mất mát, thất lạc tài liệu, sổ sách, hoặc những thiệt hại phát sinh từ việc sử dụng tài liệu, hồ sơ giấy tờ trái mục đích quy định tại Hợp đồng này. Các khoản bồi thường trong trường hợp này sẽ bao gồm cả các phí tổn, thiệt hại mà IPA LIVING phải gánh chịu là hậu quả của bất kỳ thủ tục pháp lý, tố tụng hoặc các trách nhiệm tài chính theo bất kỳ Hợp đồng nào phát sinh từ hành vi vi phạm của Cộng Tác Viên. Điều khoản này giữ nguyên hiệu lực ngay cả khi Hợp đồng này đã chấm dứt.</p> <div class=\"hd-bar\">ĐIỀU 5. DỮ LIỆU CÁ NHÂN VÀ BẢO MẬT</div> <p>1. Thông tin bảo mật gồm thông tin về Khách hàng (họ tên, địa chỉ, điện thoại, giao dịch, sức khỏe, tài khoản và dữ liệu cá nhân khác) và thông tin kinh doanh, biểu hoa hồng, tài liệu nội bộ của IPA LIVING mà Cộng Tác Viên biết được khi thực hiện Hợp đồng.</p> <p>2. Cộng Tác Viên chỉ thu thập, sử dụng dữ liệu của Khách hàng khi Khách hàng đã đồng ý riêng cho từng mục đích theo Hợp đồng. Cộng tác viên chỉ lưu trữ, chuyển dữ liệu qua hệ thống, kênh IPA LIVING cho phép, không lưu riêng trên thiết bị hay tài khoản cá nhân và không mua bán dữ liệu cá nhân.</p> <p>3. Khi phát hiện lộ, mất dữ liệu, Cộng tác viên thông báo ngay cho IPA LIVING, không quá 24 giờ, để IPA LIVING thông báo trong 72 giờ theo quy định.</p> <p>4. Cộng tác viên không tiết lộ Thông tin bảo mật trong thời hạn Hợp đồng và 03 năm sau khi chấm dứt, trừ khi pháp luật hoặc cơ quan có thẩm quyền yêu cầu; nếu có thể, Cộng tác viên thông báo trước cho IPA LIVING.</p> <p>5. IPA LIVING được cung cấp cho cơ quan nhà nước có thẩm quyền thông tin về Hợp đồng và hành vi vi phạm của Cộng tác viên theo yêu cầu của pháp luật.</p> <p>6. Cộng tác viên đồng ý để IPA LIVING xử lý dữ liệu cá nhân của mình, và của người có liên quan mà Cộng tác viên được phép cung cấp, để giao kết, thực hiện Hợp đồng, kê khai thuế và tuân thủ pháp luật.</p> <div class=\"hd-bar\">ĐIỀU 6. QUYỀN VÀ NGHĨA VỤ CỦA IPA LIVING</div> <p>1. IPA LIVING có toàn quyền quyết định về các Sản phẩm/Dịch vụ và việc phân phối các sản phẩm này trên phạm vi Lãnh thổ dựa trên mức độ hợp tác với Doanh nghiệp Đối tác, mà không phụ thuộc vào việc Cộng Tác Viên có chấp thuận hay không.</p> <p>2. IPA LIVING được thực hiện quyền kiểm tra, giám sát đối với các hoạt động của Cộng Tác Viên trong suốt quá trình thực hiện Hợp đồng này.</p> <p>3. IPA LIVING sẽ bố trí tổ chức các khóa đào tạo, hoặc hỗ trợ Cộng Tác Viên được tham gia các khóa đào tạo để Cộng Tác Viên được cấp chứng chỉ hành nghề theo đúng quy định của pháp luật. Chi phí đào tạo sẽ do Cộng Tác Viên thanh toán hoặc có thể được IPA LIVING hỗ trợ thanh toán (một phần hoặc toàn bộ) theo quyết định của IPA LIVING tùy theo từng thời điểm.</p> <p>4. IPA LIVING có toàn quyền yêu cầu Cộng Tác Viên ngừng, tạm ngừng thực hiện các Công việc bán Sản phẩm/Dịch vụ, hoặc điều chuyển, thăng bậc/hạng, hạ bậc, điều động đối với Cộng Tác Viên trong suốt thời gian có hiệu lực của Hợp đồng này.</p> <p>5. Nếu có bất kỳ khiếu kiện, khiếu nại nào của Khách hàng đối với Cộng Tác Viên thì IPA LIVING có toàn quyền ra các quyết định xử lý vi phạm hoặc/và áp dụng các biện pháp cần thiết để hạn chế thiệt hại xảy ra cho Khách hàng, Doanh nghiệp Đối tác hoặc/và IPA LIVING theo quy định của IPA LIVING tại từng thời điểm và theo đúng quy định của pháp luật.</p> <p>6. Các quyền và nghĩa vụ khác theo quy định của pháp luật.</p> <div class=\"hd-bar\">ĐIỀU 7. QUYỀN VÀ NGHĨA VỤ CỦA CỘNG TÁC VIÊN</div> <p>1. Cộng Tác Viên sẽ trực tiếp gặp gỡ, liên hệ với Khách hàng và thông báo tới IPA LIVING về các yêu cầu của Khách hàng liên quan đến Công việc cộng tác theo Hợp Đồng này.</p> <p>2. Cộng Tác Viên được hưởng thù lao theo quy định tại Phụ lục 1 của Hợp đồng này; Được IPA LIVING bố trí tham gia các khóa đào tạo, hoặc hỗ trợ Cộng Tác Viên được tham gia các khóa đào tạo để Cộng Tác Viên được cấp chứng chỉ hành nghề theo đúng quy định của pháp luật. Chi phí đào tạo sẽ do Cộng Tác Viên thanh toán hoặc có thể được IPA LIVING hỗ trợ thanh toán (một phần hoặc toàn bộ) theo quyết định của IPA LIVING tùy theo từng thời điểm.</p> <p>3. Cộng Tác Viên không được sử dụng tên, biểu tượng, thương hiệu của IPA LIVING (hoặc Doanh nghiệp Đối tác) hoặc cố ý lạm dụng uy tín của IPA LIVING (hoặc Doanh nghiệp Đối tác) để làm đảm bảo hoặc tiến hành bất kỳ giao kết nào khác để ràng buộc IPA LIVING (hoặc Doanh nghiệp Đối tác). Nếu vi phạm quy định này, Cộng Tác Viên sẽ phải chịu trách nhiệm trước pháp luật, và bồi thường toàn bộ thiệt hại gây ra cho IPA LIVING.</p> <p>4. Cộng Tác Viên đồng ý và cam kết rằng, trong thời hạn Hợp đồng này có hiệu lực hoặc bất kỳ thời điểm nào sau khi Hợp đồng này chấm dứt hiệu lực, Cộng Tác Viên sẽ không trực tiếp hay gián tiếp lôi kéo, xúi giục hoặc làm cho Khách hàng của IPA LIVING chuyển đổi, thay đổi, chấm dứt hoặc hủy bỏ Hợp Đồng cung cấp Sản phẩm/Dịch vụ đã ký; hoặc/và lôi kéo, xúi giục nhân viên/ cộng tác viên của IPA LIVING hủy bỏ mối quan hệ hoặc chấm dứt bất kì hợp đồng nào với IPA LIVING.</p> <p>5. Cộng Tác Viên có nghĩa vụ bồi thường cho IPA LIVING (hoặc Doanh nghiệp Đối tác) về mọi thiệt hại hoặc tổn thất gây ra cho IPA LIVING trong quá trình thực hiện công việc theo Hợp đồng này. IPA LIVING dựa trên khảo sát và đánh giá của mình, có toàn quyền đưa ra quyết định về mức bồi thường thiệt hại áp dụng đối với Cộng Tác Viên.</p> <p>6. Cộng Tác Viên phải tuân thủ, tại mọi thời điểm, tất cả các văn bản pháp luật, các hướng dẫn, điều kiện, chính sách, chỉ thị hay thông báo của IPA LIVING còn hiệu lực hoặc được IPA LIVING ban hành tại từng thời điểm. Cộng Tác Viên phải đạt được các yêu cầu về chỉ tiêu bán hàng, tỷ lệ hoạt động, huấn luyện, tỷ lệ duy trì hợp đồng, tuyển dụng hay các yêu cầu khác liên quan đến Công việc cộng tác do IPA LIVING hoặc/và Cơ quan Nhà nước có thẩm quyền của Việt Nam quy định tại từng thời điểm.</p> <p>7. Cộng Tác Viên chịu trách nhiệm bồi hoàn lại các khoản chi phí IPA LIVING đã hỗ trợ để Cộng Tác Viên tham gia các khóa đào tạo nếu chưa hoàn thành đủ thời gian làm việc hoặc/và các điều kiện dành cho cộng tác viên được đào tạo theo chính sách của IPA LIVING tại từng thời điểm.</p> <p>8. Cộng Tác Viên có nghĩa vụ thực hiện đúng phạm vi công việc theo quy định tại Hợp đồng này theo đặc thù của từng loại sản phẩm/dịch vụ; chịu sự kiểm tra, giám sát của IPA LIVING trong việc thực hiện các công việc theo quy định của Hợp đồng này;</p> <p>9. Cộng Tác Viên có trách nhiệm báo cáo kết quả thực hiện công việc cho IPA LIVING bất cứ thời điểm nào theo yêu cầu của IPA LIVING;</p> <p>10. Các quyền và nghĩa vụ khác theo quy định tại Hợp đồng này.</p> <div class=\"hd-bar\">ĐIỀU 8. CHẤM DỨT HỢP ĐỒNG</div> <p>1. IPA LIVING hoặc/và Cộng Tác Viên có quyền chấm dứt Hợp đồng này vào bất kỳ thời điểm nào bằng cách thông báo cho bên kia trước 03 (ba) ngày làm việc về việc chấm dứt Hợp đồng. Hai bên theo đó sẽ tiến hành giao kết thỏa thuận chấm dứt Hợp đồng Cộng tác viên.</p> <p>2. Hợp đồng này có thể bị chấm dứt ngay lập tức theo quyết định của IPA LIVING mà IPA LIVING không cần thông báo cho Cộng Tác Viên, nếu:</p> <div class=\"hd-ind\"><p>(a) IPA LIVING giải thể, phá sản theo quy định của pháp luật; hoặc bị Cơ quan Nhà nước có thẩm quyền thu hồi bất kỳ giấy phép nào cần thiết cho Công việc cộng tác theo quy định của pháp luật; hoặc IPA LIVING chấm dứt Hợp đồng đại lý/Hợp đồng hợp tác, đơn vị phân phối Sản phẩm/Dịch vụ với các doanh nghiệp Đối tác;</p> <p>(b) Cộng Tác Viên chết, bị tuyên bố mất năng lực hành vi dân sự, bị truy tố hoặc xét xử về một tội hình sự, hoặc bị cấm kinh doanh các Sản phẩm/Dịch vụ vì bất kỳ lý do gì;</p> <p>(c) Cộng Tác Viên vi phạm bất kỳ nghĩa vụ nào quy định tại Hợp Đồng này;</p> <p>(d) Cộng Tác Viên không đáp ứng được yêu cầu của IPA LIVING tại từng thời điểm, bao gồm và không giới hạn về chỉ tiêu bán hàng, năng lực khai thác, đào tạo, tỷ lệ duy trì hoạt động hoặc những yêu cầu khác liên quan đến hoạt động bán Sản phẩm/Dịch vụ do IPA LIVING đặt ra.</p></div> <p>3. Ngay khi chấm dứt Hợp Đồng này:</p> <div class=\"hd-ind\"><p>(a) Cộng Tác Viên sẽ ngay lập tức ngừng tiếp cận với khách hàng, chào bán, tư vấn hay thực hiện bất kỳ hoạt động chào bán Sản phẩm/Dịch vụ nào với tư cách là cộng tác viên của IPA LIVING;</p> <p>(b) Cộng Tác Viên chuyển giao toàn bộ tài liệu liên quan đến Hợp Đồng cung cấp Sản phẩm/Dịch vụ và các tài liệu Khách hàng mà mình đang nắm giữ cho IPA LIVING; đồng thời tiêu hủy toàn bộ các tài liệu, dữ liệu mà Cộng Tác Viên có được trong suốt thời gian thực hiện công việc theo Hợp Đồng này. IPA LIVING sẽ tiến hành thanh toán các khoản còn lại cho Cộng Tác Viên theo đúng quy định của IPA LIVING, sau khi khấu trừ đi các nghĩa vụ tài chính của Cộng Tác Viên (nếu có) theo quy định tại Hợp Đồng này;</p></div> <p>4. Sau ngày có hiệu lực của việc chấm dứt Hợp Đồng này, nếu IPA LIVING có bất kỳ yêu cầu nào đối với Cộng Tác Viên về việc bổ sung các thông tin, hồ sơ, tài liệu liên quan nào khác, thì tất cả các giao dịch đó sẽ được hiểu là thực hiện theo đúng các cam kết về nghĩa vụ theo Hợp đồng này, tuy nhiên đây sẽ không được coi là sự tái tục hay kéo dài Hợp Đồng này.</p> <div class=\"hd-bar\">ĐIỀU 9. THÔNG BÁO</div> <p>1. Mọi thông báo của Cộng Tác Viên gửi đến IPA LIVING phải được lập thành văn bản và được gửi đến địa chỉ của IPA LIVING hoặc bên được IPA LIVING chỉ định cụ thể trong từng thời điểm.</p> <p>2. Bất kỳ thông báo nào của IPA LIVING cho Cộng Tác Viên theo Hợp Đồng này đều được coi là đã được gửi hợp lệ nếu được gửi đến địa chỉ của Cộng Tác Viên nêu tại phần đầu Hợp đồng này, hoặc giao trực tiếp hoặc qua các phương tiện điện tử khác (email, fax). Trong trường hợp, các thông báo và thông tin được IPA LIVING đăng tải qua cổng thông tin điện tử của IPA LIVING thì đều được xem là đã được gửi đến và đã nhận bởi Cộng Tác Viên tại thời điểm thông báo.</p> <div class=\"hd-bar\">ĐIỀU 10. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</div> <p>1. Hợp Đồng này được hiểu và điều chỉnh bởi pháp luật Việt Nam.</p> <p>2. Bất kỳ tranh chấp nào phát sinh từ hoặc liên quan đến Hợp Đồng, bao gồm bất kỳ tranh chấp nào liên quan đến sự tồn tại, hiệu lực hoặc chấm dứt Hợp Đồng sẽ được giải quyết tại Tòa án nhân dân có thẩm quyền nơi IPA LIVING đặt trụ sở chính tại thời điểm nộp đơn yêu cầu.</p> <div class=\"hd-bar\">ĐIỀU 11. CÁC ĐIỀU KHOẢN KHÁC</div> <p>1. Hợp Đồng này bao gồm các Phụ Lục, văn bản đính kèm và các văn bản thoả thuận bổ sung, điều chỉnh (nếu có) trong quá trình thực hiện Hợp Đồng, tất cả tạo thành một phần không thể tách rời của Hợp Đồng.</p> <p>2. Việc bất kỳ điều khoản nào của Hợp Đồng này không có giá trị pháp lý, không hợp pháp hoặc không thể thi hành được theo bất kỳ các luật được áp dụng nào sẽ không làm phương hại hoặc ảnh hưởng đến bất kỳ điều khoản nào khác của Hợp Đồng này, các điều khoản còn lại sẽ vẫn duy trì đủ hiệu lực và giá trị pháp lý trong phạm vi pháp luật cho phép.</p> <p>3. Việc bỏ qua không thực hiện bất kỳ quyền hay hành động nào của IPA LIVING theo Hợp đồng này sẽ không được coi là việc IPA LIVING từ bỏ quyền ra yêu cầu hoặc đòi hỏi đối với Cộng Tác Viên về các tổn thất hoặc đền bù.</p> <p>4. Để tránh hiểu lầm, tên gọi của các Hợp Đồng cung cấp Sản phẩm/Dịch vụ ký giữa IPA LIVING (hoặc Doanh nghiệp Đối tác) với Khách hàng sẽ không ảnh hưởng đến việc giải thích và áp dụng đối với các quyền và nghĩa vụ của các bên liên quan đến Hợp đồng này.</p> <p>5. Hợp Đồng này có hiệu lực kể từ ngày giao kết.</p> <p>Trường hợp Cộng Tác Viên thực hiện giao dịch điện tử, Các Điều Khoản của Hợp đồng này mặc nhiên có hiệu lực pháp lý ràng buộc Cộng Tác Viên và có giá trị như hợp đồng được Cộng Tác Viên giao kết bằng văn bản ngay từ thời điểm Cộng Tác Viên sử dụng Mã xác thực (mã OTP hoặc Yếu tố sinh trắc học hoặc Chữ ký số) của Cộng Tác Viên để giao kết/xác nhận giao kết Hợp đồng này.</p> <p class=\"hd-pl\"><strong>PHỤ LỤC 01: THÙ LAO ÁP DỤNG CHO CỘNG TÁC VIÊN</strong></p> <p class=\"hd-c\"><em>(Kèm Hợp Đồng Cộng Tác Viên giao kết ngày {{DMY}} giữa Cộng Tác Viên và IPA LIVING)</em></p> <p>1. Cơ chế thù lao, Mức thù lao mà Cộng Tác Viên được hưởng sẽ do IPA LIVING quyết định tương ứng với từng loại Sản phẩm/Dịch vụ và được IPA LIVING thông báo cho Cộng Tác Viên trong từng thời kỳ.</p> <p>Cộng Tác Viên chấp thuận cơ chế và mức thù lao dành cho Cộng tác viên theo thông báo của IPA LIVING gửi đến Cộng Tác Viên trong từng thời kỳ.</p> <p>2. Trên cơ sở kết quả công việc thực hiện của Cộng Tác Viên, IPA LIVING sẽ tiến hành tổng hợp và thực hiện chi trả thù lao cho Cộng Tác Viên theo quy định của IPA LIVING.</p> <p>Thời gian IPA LIVING thực hiện thanh toán thù lao cho Cộng Tác Viên là ngày 15 của tháng phát sinh doanh thu mà IPA LIVING thực tế thu được từ Khách hàng.</p> <p>Thù lao sẽ được IPA LIVING trả cho Cộng Tác Viên bằng hình thức chuyển khoản vào tài khoản của Cộng Tác Viên sau khi khấu trừ thuế thu nhập cá nhân theo quy định.</p> <p>3. Phụ lục này là một bộ phận không tách rời khỏi Hợp Đồng Cộng Tác Viên được giao kết giữa IPA LIVING với Cộng Tác Viên.</p> <p>Phụ lục này có hiệu lực kể từ ngày giao kết.</p> <table class=\"hd-sign\"> <colgroup> <col style=\"width: 50%\" /> <col style=\"width: 50%\" /> </colgroup> <thead> <tr class=\"header\"> <th><p><strong>CÔNG TY CỔ PHẦN IPA LIVING</strong></p> <p>Họ tên Người đại diện: <strong>Tạ Phương Thanh</strong></p> <p>Chức danh: <strong>Tổng giám đốc</strong></p> <p>Thời điểm ký/xác nhận:</p></th> <th><p><strong>CỘNG TÁC VIÊN</strong></p> <p>Họ tên Khách hàng: <strong>{{NAME}}</strong></p> <p>Chữ ký/Mã xác nhận:</p> <p>Thời điểm ký/xác nhận:</p></th> </tr> </thead> <tbody> </tbody> </table> ";

/* ======================= HELPER RENDER ======================= */
function inp(p,o={}){
  const dis=o.disabled;
  return `<div class="inp${dis?' dis':''}"><input ${o.id?`id="${o.id}"`:''} type="${o.type||'text'}" value="${esc(get(p))}" placeholder="${esc(o.ph||'')}" ${dis?'disabled':''} ${o.max?`maxlength="${o.max}"`:''} oninput="set('${p}',this.value);clrErr(this);${o.on||''}">${o.sfx||''}</div>`;
}
function sel(p,opts,o={}){
  const v=get(p);
  return `<div class="inp${o.disabled?' dis':''}"><select required ${o.disabled?'disabled':''} onchange="set('${p}',this.value);${o.on||''}render()"><option value="" disabled hidden ${!v?'selected':''}>${esc(o.ph||'')}</option>${opts.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${ICON.down}</div>`;
}
function fld(label,req,ctrl,p,cls=''){
  const e=p&&E(p);
  return `<div class="fld ${cls} ${e?'err-on':''}"><label>${req?'<i>*</i> ':''}${label}</label>${ctrl}${e?`<div class="err">${e}</div>`:''}</div>`;
}
function pw(p,k){
  const show=view.pw[k];
  return inp(p,{type:show?'text':'password',sfx:`<span class="sfx" onclick="view.pw['${k}']=!view.pw['${k}'];render()">${show?ICON.eye:ICON.eyeOff}</span>`});
}
function radio(p,name,val,label){
  return `<label class="rd"><input type="radio" name="${name}" ${get(p)===val?'checked':''} onchange="set('${p}','${val}');${name==='rt'?'render()':'clrErr(this)'}"><span></span>${label}</label>`;
}
function modal(inner,w,close,style=''){
  return `<div class="ov" id="ov"><div class="mdl" style="width:${w}px;${style}"><button class="x" onclick="${close}">${ICON.x}</button>${inner}</div></div>`;
}
function otpBoxes(g){
  return `<div class="otp-boxes" data-g="${g}">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" oninput="otpIn(this,'${g}')" onkeydown="otpKey(event,this)">`).join('')}</div>`;
}
function otpIn(el,g){
  el.value=el.value.replace(/\D/g,'').slice(-1);
  if(el.value&&el.nextElementSibling)el.nextElementSibling.focus();
  const all=[...el.parentNode.children].every(x=>x.value);
  const b=$(g+'btn');
  if(b){b.disabled=!all;b.className=all?'btn-pri':'btn-dis';}
}
function otpKey(e,el){if(e.key==='Backspace'&&!el.value&&el.previousElementSibling)el.previousElementSibling.focus();}

function rsHtml(){return view.cd>0?`Gửi lại OTP (${view.cd}s)`:`<a onclick="view.cd=60;updTimers()">Gửi lại OTP</a>`;}
function rs2Html(){return view.cd>0?`Gửi lại OTP (sau ${view.cd}s)`:`<a onclick="view.cd=60;updTimers()">Gửi lại OTP</a>`;}
function updTimers(){
  if($('rs'))$('rs').innerHTML=rsHtml();
  if($('rs2'))$('rs2').innerHTML=rs2Html();
  if($('exp'))$('exp').textContent=`Mã OTP sẽ hết hạn trong vòng ${Math.floor(view.exp/60)}:${String(view.exp%60).padStart(2,'0')}s`;
}

    ${fld('Số điện thoại',1,inp('reg.phone',{max:10,on:"$('uname').value=this.value?'dst_'+this.value:''"}),'reg.phone')}

    ${fld('Tên đăng nhập (hệ thống tự sinh)',1,`<div class="inp dis"><input id="uname" disabled value="${S.reg.phone?'dst_'+esc(S.reg.phone):''}"></div>`)}
    ${fld('Mật khẩu',1,pw('reg.password','p1'),'reg.password')}

    <button class="btn-pri full" onclick="submitReg()">ĐĂNG KÝ</button>
    <p class="terms">Bằng cách nhấp vào Đăng Ký, bạn đồng ý với <a>các điều khoản sử dụng</a> của chúng tôi</p>
    <p class="terms" style="margin-top:8px">Đã có tài khoản? <a>Đăng nhập</a></p>
  </div></div>`;
}
function submitReg(){
  const r=S.reg,e={};
  if(!r.fullName.trim())e['reg.fullName']='Vui lòng nhập họ và tên';
  if(!/^0\d{9}$/.test(r.phone))e['reg.phone']=r.phone?'Số điện thoại không hợp lệ':'Vui lòng nhập số điện thoại';
  if(r.email&&!/^\S+@\S+\.\S+$/.test(r.email))e['reg.email']='Email không đúng định dạng';
  if(!r.password)e['reg.password']='Vui lòng nhập mật khẩu';
  else if(r.password.length<8)e['reg.password']='Mật khẩu tối thiểu 8 ký tự';
  if(!r.password2)e['reg.password2']='Vui lòng nhập lại mật khẩu';
  else if(r.password2!==r.password)e['reg.password2']='Mật khẩu nhập lại không khớp';
  if(Object.keys(e).length){view.errors=e;render();return;}
  go(2);
}

    ${AGREE_TEXTS.map((t,i)=>`<label class="ck"${i?' style="margin-top:8px"':''}><input type="checkbox" ${view.agree[i]?'checked':''} onchange="view.agree[${i}]=this.checked;updSign()"> ${t}</label>`).join('')}
    <div class="btns ct-btns" style="margin-top:14px"><button class="btn-def" onclick="go(4)">ĐÓNG</button><button id="signBtn" class="${ok?'btn-pri':'btn-dis'}" ${ok?'':'disabled'} onclick="go(11)">GIAO KẾT THỎA THUẬN</button></div>
    ${view.sub==='otp2'?subOtp():view.sub==='ok'?subOk():''}`,720,'go(4)','padding:24px 20px 30px');
}

/* ======================= ĐIỀU HƯỚNG ======================= */
function ensure(n){
  if(n>=2&&!S.reg.fullName)Object.assign(S.reg,SAMPLE.reg);
  if(n>=6){S.up.front=S.up.back=true;if(!S.ocr.id)Object.assign(S.ocr,SAMPLE.ocr);}
  if(n>=8&&isNhom()&&!S.extra.groupCode)Object.assign(S.extra,SAMPLE.group);
  if(n>=9){
    if(!S.extra.province)Object.assign(S.extra,SAMPLE.extra);
  }
}
function go(n,keep){
  ensure(n);
  if(n<=3||(n>=5&&n<=12))S.ctvDone=false;
  if(n===13)S.ctvDone=true;
  view.step=n;view.errors={};view.sub=null;
  if(n===2)view.cd=60;
  if(n===10&&!keep){view.read=false;view.agree=AGREE_TEXTS.map(()=>false);}
  if(n===11){view.read=true;view.agree=AGREE_TEXTS.map(()=>true);view.sub='otp2';view.cd=60;view.exp=300;}
  if(n===12){
    view.read=true;view.agree=AGREE_TEXTS.map(()=>true);view.sub='ok';
    const d=new Date(),p=v=>String(v).padStart(2,'0');
    S.code=`${Math.floor(Math.random()*9)+1}HD_CR_DSTATION${d.getFullYear()}`;
    S.time=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} - ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
  }
  render(true);
}
function scen(t){
  S.extra.regType=t;
  if(t==='nhom'&&!S.extra.groupCode&&view.step>=8)Object.assign(S.extra,SAMPLE.group);
  render();
}
function renderProto(){
  const steps=[1,2,3,4,5,6,8,9,10,11,12,13],chg=[8,9,13];
  const tips={1:'Đăng ký mở tài khoản',2:'OTP mở tài khoản',3:'Hồ sơ (chưa là CTV)',4:'Chương trình hợp tác',5:'Tải CCCD',6:'Xác thực OCR',8:'Thông tin bổ sung (có bổ sung)',9:'Xác nhận thông tin (có bổ sung)',10:'Hợp đồng CTV',11:'OTP giao kết',12:'Giao kết thành công',13:'Hồ sơ sau đăng ký CTV (có bổ sung)'};
  $('proto').innerHTML=`<span class="t">Prototype · Đăng ký cộng tác viên</span>
    <span class="lb">Bước:</span><div class="chips">${steps.map(s=>`<button class="chip ${s===view.step?'on':''} ${chg.includes(s)?'chg':''}" title="${tips[s]}" onclick="go(${s})">${s}</button>`).join('')}</div>
    <span class="lg"><i></i>có bổ sung</span>
    <span class="lb" style="margin-left:8px">Kịch bản:</span><div class="seg"><button class="${isNhom()?'':'on'}" onclick="scen('le')">CTV lẻ</button><button class="${isNhom()?'on':''}" onclick="scen('nhom')">CTV nhóm</button></div>
    <span class="sp"></span>
    <button class="chip" onclick="location.reload()">Làm lại từ đầu</button>`;
}
function render(fresh){
  const ov=$('ov'),st=ov&&!fresh?ov.scrollTop:0;
  const m={2:mOtp1,5:mCccd,6:mOcr,8:mExtra,9:mConfirm,10:mContract,11:mContract,12:mContract}[view.step];
  $('app').innerHTML=header()+(view.step<=2?pRegister():pProfile())+(m?m():'');
  renderProto();
  if($('ov'))$('ov').scrollTop=st;
  if(fresh)window.scrollTo(0,0);
  const doc=$('doc');if(doc&&view.read)doc.scrollTop=doc.scrollHeight;
  updTimers();
  const o=document.querySelector('.otp-boxes input');if(o&&fresh)o.focus();
}
render();
</script>
